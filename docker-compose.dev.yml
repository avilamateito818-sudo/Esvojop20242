name: esvojop2026-dev

services:
  esvojop_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: esvojop-dev:2026
    container_name: esvojop_dev_app
    restart: unless-stopped
    volumes:
      # Montaje en tiempo real: cualquier cambio en el código se refleja al instante
      - .:/app
    ports:
      # Puerto 8086 unificado para desarrollo
      - "${ESVOJOP_DEV_PORT:-8086}:8080"
    networks:
      - esvojop_dev_net
    environment:
      - NODE_ENV=development
      - TZ=America/Bogota
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  esvojop_dev_net:
    name: esvojop_dev_net
    driver: bridge
