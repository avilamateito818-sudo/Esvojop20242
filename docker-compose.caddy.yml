name: esvojop2026-caddy

services:
  esvojop_caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: esvojop-caddy:2026
    container_name: esvojop_caddy_app
    restart: unless-stopped
    ports:
      # Puerto 8086 unificado (y preparado para HTTPS 443 si se expone dominio directo)
      - "${ESVOJOP_CADDY_PORT:-8086}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - esvojop_caddy_net
    environment:
      - NODE_ENV=production
      - TZ=America/Bogota
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:

networks:
  esvojop_caddy_net:
    name: esvojop_caddy_net
    driver: bridge
