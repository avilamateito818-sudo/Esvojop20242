name: esvojop2026

services:
  esvojop_web:
    build:
      context: .
      dockerfile: Dockerfile
    image: esvojop-frontend:2026
    container_name: esvojop_web_app
    restart: unless-stopped
    ports:
      # Puerto 8086 unificado para producción y dominio
      - "${ESVOJOP_PORT:-8086}:80"
    networks:
      - esvojop_isolated_network
    environment:
      - NODE_ENV=production
      - TZ=America/Bogota
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,mode=1777,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      - /var/log/nginx:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  esvojop_isolated_network:
    name: esvojop_isolated_network
    driver: bridge
