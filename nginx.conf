worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compresión Gzip para máximo rendimiento y carga instantánea
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad reforzadas para producción en dominio
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none';" always;

        # Bloquear acceso a archivos ocultos (.git, .env, .vscode) y configuración
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (Dockerfile|docker-compose|nginx\.conf|Caddyfile|\.bat)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # HTML sin caché agresivo para reflejar despliegues inmediatos
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none';" always;
        }

        # Enrutamiento de páginas estáticas
        location / {
            try_files $uri $uri/ =404;
        }

        # Caché equilibrado para CSS, JS e imágenes
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Páginas de error personalizadas
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
